name: Build PalmClix

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Backend copies are in sync
        run: |
          diff palmclix.py Sources/PalmClix/Backend/palmclix.py
          diff decode_palmclix.py Sources/PalmClix/Backend/decode_palmclix.py
      - run: python -m unittest discover -s tests -v

  macos:
    needs: tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build PalmClix.app
        run: |
          brew list --versions libusb || brew install libusb
          python3 -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          ./build_app.sh
      - name: Launch check
        run: |
          ./PalmClix.app/Contents/MacOS/PalmClixMac &
          PID=$!
          sleep 8
          kill -0 $PID && echo "PalmClix stayed running" && kill $PID
      - name: Zip
        run: ditto -c -k --sequesterRsrc --keepParent PalmClix.app PalmClix-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PalmClix-macOS
          path: PalmClix-macOS.zip

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build PalmClix.exe
        shell: pwsh
        run: windows\build_windows.ps1
      - name: Launch check + screenshot
        shell: pwsh
        run: |
          $p = Start-Process "windows\dist\PalmClix\PalmClix.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "PalmClix.exe exited early with code $($p.ExitCode)" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("windows-screenshot.png")
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        with:
          name: PalmClix-Windows
          path: PalmClix-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshot
          path: windows-screenshot.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PalmClix-macOS/PalmClix-macOS.zip
            artifacts/PalmClix-Windows/PalmClix-Windows.zip
          generate_release_notes: true
